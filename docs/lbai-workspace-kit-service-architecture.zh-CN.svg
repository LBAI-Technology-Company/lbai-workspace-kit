<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">LBAI Workspace Kit + Service 产品架构说明图</title>
  <desc id="desc">展示员工入口、Workspace Kit、后端知识 Service 和价值闭环之间的数据流与职责边界。</desc>
  <defs>
    <style>
      .bg { fill: #f7f9fc; }
      .title { font: 700 42px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #172033; }
      .subtitle { font: 400 20px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #5c667a; }
      .section-title { font: 700 26px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #172033; }
      .section-note { font: 500 16px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #647086; }
      .card-title { font: 700 20px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #172033; }
      .card-text { font: 400 16px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #475166; }
      .small { font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #647086; }
      .badge { font: 700 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; }
      .white-card { fill: #ffffff; stroke: #d9e1ee; stroke-width: 1.4; }
      .blue-panel { fill: #eaf2ff; stroke: #b9d0f5; stroke-width: 1.4; }
      .green-panel { fill: #e9f7f0; stroke: #a9dabb; stroke-width: 1.4; }
      .orange-panel { fill: #fff3e3; stroke: #f3c37e; stroke-width: 1.4; }
      .purple-panel { fill: #f1ecff; stroke: #cbbbff; stroke-width: 1.4; }
      .line { stroke: #50627d; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .loop-line { stroke: #356d7b; stroke-width: 3; fill: none; marker-end: url(#arrow-teal); }
      .dash { stroke-dasharray: 8 8; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#50627d"/>
    </marker>
    <marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#356d7b"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="1000"/>

  <text class="title" x="80" y="78">LBAI Workspace Kit + Service</text>
  <text class="subtitle" x="80" y="116">让 Cursor / Codex 在公司规则、证据边界、任务流程和交付标准里稳定工作</text>

  <rect x="80" y="145" width="1440" height="66" rx="8" fill="#172033"/>
  <text x="110" y="187" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="22" font-weight="700" fill="#ffffff">核心闭环：</text>
  <text x="235" y="187" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="21" fill="#dce7f7">员工资料进入 private workspace → 后端抽取事实 → 任务中检索证据包 → AI 基于证据交付 → 结果回流沉淀</text>

  <g transform="translate(80 250)">
    <rect class="blue-panel" x="0" y="0" width="400" height="430" rx="12"/>
    <text class="section-title" x="30" y="46">1. 员工入口层</text>
    <text class="section-note" x="30" y="75">员工日常只需要轻量入口</text>
    <rect x="285" y="28" width="82" height="28" rx="14" fill="#2f6fd6"/>
    <text class="badge" x="326" y="47" text-anchor="middle" fill="#ffffff">已落地</text>

    <rect class="white-card" x="30" y="105" width="340" height="72" rx="8"/>
    <text class="card-title" x="55" y="135">安装与初始化</text>
    <text class="card-text" x="55" y="160">install.sh / install.ps1 + lbai CLI</text>

    <rect class="white-card" x="30" y="197" width="340" height="72" rx="8"/>
    <text class="card-title" x="55" y="227">打开工作区</text>
    <text class="card-text" x="55" y="252">绑定 private GitHub workspace</text>

    <rect class="white-card" x="30" y="289" width="340" height="92" rx="8"/>
    <text class="card-title" x="55" y="319">Cursor / Codex 命令</text>
    <text class="card-text" x="55" y="346">/lbai-init /lbai-new-task</text>
    <text class="card-text" x="55" y="369">/lbai-add-evidence /lbai-finish-task</text>
  </g>

  <g transform="translate(600 250)">
    <rect class="green-panel" x="0" y="0" width="400" height="430" rx="12"/>
    <text class="section-title" x="30" y="46">2. Workspace Kit 层</text>
    <text class="section-note" x="30" y="75">公司维护的员工工作区系统</text>
    <rect x="285" y="28" width="82" height="28" rx="14" fill="#25885a"/>
    <text class="badge" x="326" y="47" text-anchor="middle" fill="#ffffff">已落地</text>

    <rect class="white-card" x="30" y="105" width="340" height="72" rx="8"/>
    <text class="card-title" x="55" y="135">资料沉淀 Evidence</text>
    <text class="card-text" x="55" y="160">raw.md / metadata.json / enrichment</text>

    <rect class="white-card" x="30" y="197" width="340" height="72" rx="8"/>
    <text class="card-title" x="55" y="227">任务生命周期</text>
    <text class="card-text" x="55" y="252">建档 → 执行 → 收尾 → 台账</text>

    <rect class="white-card" x="30" y="289" width="340" height="92" rx="8"/>
    <text class="card-title" x="55" y="319">安全同步</text>
    <text class="card-text" x="55" y="346">敏感检查 / review 边界 / Git push</text>
    <text class="card-text" x="55" y="369">dashboard 展示工作区状态</text>
  </g>

  <g transform="translate(1120 250)">
    <rect class="orange-panel" x="0" y="0" width="400" height="430" rx="12"/>
    <text class="section-title" x="30" y="46">3. Backend Service 层</text>
    <text class="section-note" x="30" y="75">集中式公司知识处理与检索</text>
    <rect x="270" y="62" width="100" height="28" rx="14" fill="#c47719"/>
    <text class="badge" x="320" y="81" text-anchor="middle" fill="#ffffff">规划/MVP</text>

    <rect class="white-card" x="30" y="105" width="340" height="72" rx="8"/>
    <text class="card-title" x="55" y="135">GitHub 同步</text>
    <text class="card-text" x="55" y="160">webhook / 定时同步多个 workspace</text>

    <rect class="white-card" x="30" y="197" width="340" height="72" rx="8"/>
    <text class="card-title" x="55" y="227">事实抽取与校验</text>
    <text class="card-text" x="55" y="252">文档解析 → Schema → fact_event</text>

    <rect class="white-card" x="30" y="289" width="340" height="92" rx="8"/>
    <text class="card-title" x="55" y="319">知识检索 API</text>
    <text class="card-text" x="55" y="346">权限过滤 / 同义词 / LLM 相关性</text>
    <text class="card-text" x="55" y="369">POST /v1/search/evidence</text>
  </g>

  <path class="line" d="M485 465 C520 465, 560 465, 590 465"/>
  <path class="line" d="M1005 465 C1040 465, 1080 465, 1110 465"/>
  <text class="small" x="520" y="442">标准化落盘</text>
  <text class="small" x="1040" y="442">GitHub 同步</text>

  <path class="line dash" d="M1120 612 C1070 710, 945 735, 835 704"/>
  <text class="small" x="944" y="724">返回 evidence_pack 给当前任务使用</text>

  <g transform="translate(80 740)">
    <rect class="purple-panel" x="0" y="0" width="1440" height="190" rx="12"/>
    <text class="section-title" x="30" y="44">4. 价值闭环层</text>
    <text class="section-note" x="190" y="44">可追踪、可复盘、可检索、可持续沉淀</text>

    <g transform="translate(42 78)">
      <rect class="white-card" x="0" y="0" width="220" height="72" rx="8"/>
      <text class="card-title" x="24" y="30">资料沉淀</text>
      <text class="card-text" x="24" y="55">会议 / 反馈 / 制度 / 项目材料</text>
    </g>
    <path class="loop-line" d="M285 114 L370 114"/>

    <g transform="translate(390 78)">
      <rect class="white-card" x="0" y="0" width="220" height="72" rx="8"/>
      <text class="card-title" x="24" y="30">事实入库</text>
      <text class="card-text" x="24" y="55">fact_event + 来源追溯</text>
    </g>
    <path class="loop-line" d="M633 114 L718 114"/>

    <g transform="translate(738 78)">
      <rect class="white-card" x="0" y="0" width="220" height="72" rx="8"/>
      <text class="card-title" x="24" y="30">证据检索</text>
      <text class="card-text" x="24" y="55">backend_search_query_plan</text>
    </g>
    <path class="loop-line" d="M981 114 L1066 114"/>

    <g transform="translate(1086 78)">
      <rect class="white-card" x="0" y="0" width="300" height="72" rx="8"/>
      <text class="card-title" x="24" y="30">AI 基于证据交付</text>
      <text class="card-text" x="24" y="55">任务输出 → 收尾检查 → 知识回流</text>
    </g>
  </g>

  <g transform="translate(80 948)">
    <rect x="0" y="-22" width="18" height="18" rx="4" fill="#25885a"/>
    <text class="small" x="28" y="-8">已落地：kit、workspace 模板、CLI、/lbai-* 工作流、资料/任务落盘、后端检索调用契约</text>
    <rect x="780" y="-22" width="18" height="18" rx="4" fill="#c47719"/>
    <text class="small" x="808" y="-8">规划/MVP：完整后端 service 的同步、抽取、入库、权限和检索服务</text>
  </g>
</svg>
